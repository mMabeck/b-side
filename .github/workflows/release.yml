name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag
        run: |
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($expected); cut releases with scripts/release.sh"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-

      - name: Test
        run: swift test --no-parallel

      - name: Bundle
        run: ./scripts/bundle.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh dist/B-Side.app

      - name: Package
        run: |
          mkdir release
          ./scripts/make-dmg.sh dist/B-Side.app "release/B-Side-${GITHUB_REF_NAME}-arm64.dmg"
          ditto -c -k --keepParent dist/B-Side.app "release/B-Side-${GITHUB_REF_NAME}-arm64.zip"
          (cd release && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "B-Side ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${prerelease[@]}"
