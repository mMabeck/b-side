name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-

      - name: Test
        run: swift test --no-parallel

      - name: Bundle
        env:
          BSIDE_VERSION: ${{ github.ref_name }}
          BSIDE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export BSIDE_VERSION="${BSIDE_VERSION#v}"
          ./scripts/bundle.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh dist/B-Side.app

      - name: Package
        run: |
          ditto -c -k --keepParent dist/B-Side.app "B-Side-${GITHUB_REF_NAME}-arm64.zip"
          shasum -a 256 "B-Side-${GITHUB_REF_NAME}-arm64.zip" > "B-Side-${GITHUB_REF_NAME}-arm64.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            "B-Side-${GITHUB_REF_NAME}-arm64.zip" \
            "B-Side-${GITHUB_REF_NAME}-arm64.zip.sha256" \
            --title "B-Side ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${prerelease[@]}"
