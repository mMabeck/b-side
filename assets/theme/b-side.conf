# B-Side — dark. Ghostty theme matching the app icon.
# Drop in ~/.config/ghostty/themes/b-side and set `theme = b-side`.
# The app derives its whole-window palette from the active Ghostty theme, so
# this file is the single source of truth for the brand colours.

background = 16141c
foreground = ede7d8
cursor-color = ff6c2f
cursor-text = 16141c
selection-background = 3f2417
selection-foreground = f3eee2

